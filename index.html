<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Montserrat',sans-serif;
    background:#eef3ed;
}

body{
    background:url('background.png') no-repeat center center fixed;
    background-size:cover;
}

.bg-overlay{
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top left,rgba(255,255,255,.7),transparent 35%),
    radial-gradient(circle at bottom right,rgba(76,175,80,.08),transparent 30%);
    pointer-events:none;
    z-index:0;
}

.floating-light{
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    filter:blur(80px);
    background:rgba(76,175,80,.09);
    z-index:0;
    animation:floatLight 10s ease-in-out infinite;
}

.floating-light.one{ top:-180px; left:-120px; }
.floating-light.two{ bottom:-220px; right:-120px; animation-delay:3s; }

@keyframes floatLight{
    0%{ transform:translate(0,0); }
    50%{ transform:translate(40px,30px); }
    100%{ transform:translate(0,0); }
}

.logo-top-right{
    position:fixed;
    top:18px;
    right:18px;
    z-index:9999;
    transition:.3s;
}

.logo-top-right:hover{ transform:scale(1.05); }
.logo-top-right img{
    height:60px;
    filter:drop-shadow(0 8px 20px rgba(0,0,0,.18));
}

#product-header{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:9999;
    background:linear-gradient(145deg,#2e7d32,#43a047);
    padding:14px 34px;
    border-radius:999px;
    border:2px solid #fbc02d;
    font-size:18px;
    font-weight:900;
    letter-spacing:.5px;
    color:white;
    box-shadow: 0 15px 35px rgba(46,125,50,.35), inset 0 1px 2px rgba(255,255,255,.2);
    backdrop-filter:blur(18px);
    white-space:nowrap;
}

.nav-zone{
    position:fixed;
    top:0;
    bottom:0;
    width:15%;
    z-index:999;
    cursor:pointer;
}
#left-zone{ left:0; }
#right-zone{ right:0; }

model-viewer{
    width:100%;
    height:100vh;
    --progress-bar-color:transparent;
    z-index: 10;
    position: relative;
}

#custom-loader {
    position: fixed;
    inset: 0;
    background: rgba(238, 243, 237, 0.95);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 50000;
    transition: opacity 0.4s ease;
}

.loading-text {
    font-size: 14px;
    font-weight: 900;
    color: #2e7d32;
    letter-spacing: 2px;
    margin-bottom: 15px;
}

.progress-container {
    width: 70%;
    max-width: 350px;
    height: 10px;
    background: rgba(46, 125, 50, 0.15);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #fbc02d, #2e7d32);
    border-radius: 20px;
    transition: width 0.2s linear;
}

#window-overlay {
    position: fixed;
    inset: 0;
    z-index: 999999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(15px);
}

.window-box {
    position: relative;
    width: 100%;
    max-width: 650px;
    max-height: 80vh;
    overflow: hidden;
    border-radius: 24px;
    background: rgba(255,255,255,0.98);
    border: 1px solid rgba(255,255,255,0.6);
    box-shadow: 0 35px 80px rgba(0,0,0,0.3);
    animation: popup 0.35s cubic-bezier(0.165, 0.84, 0.44, 1);
}

@keyframes popup {
    from { transform: scale(0.92); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.window-content {
    padding: 28px;
    overflow-y: auto;
    max-height: 80vh;
}

.close-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(145deg, #ef5350, #d32f2f);
    font-size: 14px;
    font-weight: 900;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(211,47,47,0.25);
    z-index: 10;
}

.window-title {
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #2e7d32;
    padding-bottom: 12px;
    margin-bottom: 16px;
    border-bottom: 2px solid #fbc02d;
}

.table-responsive {
    width: 100%;
    overflow-x: auto;
    margin-top: 5px;
    border-radius: 10px;
}

.official-spec-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

.official-spec-table th, .official-spec-table td {
    padding: 12px 14px;
    border-bottom: 1px solid #eef3ed;
}

.official-spec-table th {
    background-color: #2e7d32;
    color: white;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.5px;
    text-align: left;
}

.official-spec-table tr:nth-child(even) { background-color: #f9fbf9; }
.official-spec-table td.param-name { font-weight: 700; color: #2e7d32; width: 38%; }
.official-spec-table td.param-value { color: #333; font-weight: 500; }

#tutorial {
    position: fixed;
    inset: 0;
    z-index: 999999;
    background: rgba(0,0,0,0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: white;
    transition: 0.4s;
}

.hand { font-size: 55px; animation: swipe 2s infinite ease-in-out; }
@keyframes swipe {
    0%, 100% { transform: translateX(-35px); }
    50% { transform: translateX(35px); }
}

.tutorial-text {
    margin-top: 18px;
    text-align: center;
    font-size: 14px;
    font-weight: 800;
    line-height: 1.6;
    letter-spacing: 0.5px;
}

.ar-btn {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    z-index: 99999;
    padding: 15px 55px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(145deg, #2e7d32, #43a047);
    font-size: 13px;
    font-weight: 900;
    color: white;
    cursor: pointer;
    box-shadow: 0 12px 25px rgba(46,125,50,0.25);
    transition: 0.3s;
}

.ar-btn:hover { transform: translateX(-50%) translateY(-2px); }
.blurred { filter: blur(5px) brightness(0.7); }

@media(max-width:768px){
    #product-header { width: 82%; font-size: 13px; padding: 11px 14px; }
    .logo-top-right img { height: 44px; }
    .ar-btn { width: 80%; padding: 13px; bottom: 16px; }
}
</style>
</head>

<body>

<div class="bg-overlay"></div>
<div class="floating-light one"></div>
<div class="floating-light two"></div>

<a href="https://iopri.co.id/" target="_blank" class="logo-top-right">
    <img src="logo-PPKS.png" alt="Logo PPKS">
</a>

<div id="product-header">KECAMBAH SAWIT PPKS</div>

<div id="left-zone" class="nav-zone" onclick="changeProduct(-1)"></div>
<div id="right-zone" class="nav-zone" onclick="changeProduct(1)"></div>

<div id="custom-loader">
    <div class="loading-text">MEMUAT 3D... <span id="load-pct">0%</span></div>
    <div class="progress-container">
        <div class="progress-fill" id="progress-fill"></div>
    </div>
</div>

<div id="tutorial" onclick="hideTutorial()">
    <div class="hand">👆</div>
    <div class="tutorial-text">
        GESER PRODUK UNTUK MELIHAT ROTASI 360°<br>
        TEKAN KIRI / KANAN LAYAR UNTUK GANTI BARANG
    </div>
</div>

<div id="window-overlay" onclick="closeWindow(event)">
    <div class="window-box" onclick="event.stopPropagation()">
        <button class="close-btn" onclick="closeWindow()">✕</button>
        <div class="window-content" id="window-body"></div>
    </div>
</div>

<button class="ar-btn" onclick="activateCurrentAR()">BUKA KATALOG AR</button>

<model-viewer id="main-viewer"
    src="kecambah_sawit.glb"
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate 
    rotation-per-second="8deg" 
    interaction-prompt="none" 
    field-of-view="28deg" 
    camera-orbit="0deg 75deg auto" 
    environment-image="neutral" 
    onclick="hideTutorial()">

    </model-viewer>

<script>
const productsData = [
    { id: 'kecambah', name: 'KECAMBAH SAWIT PPKS', src: 'kecambah_sawit.glb' },
    { id: 'bibit3', name: 'BIBIT SAWIT 3 BULAN (PN)', src: 'bibitsawit3bulan.glb' },
    { id: 'bibit8', name: 'BIBIT SAWIT 4-8 BULAN (MN)', src: 'bibitsawit4-8bulan.glb' },
    { id: 'bibit12', name: 'BIBIT SAWIT 9-12 BULAN', src: 'bibitsawit9-12bulan.glb' },
    { id: 'bioneensis', name: 'BIONEENSIS (PUPUK HAYATI)', src: 'bioneensis.glb' },
    { id: 'feromonas', name: 'FEROMONAS (TRAP ORYCTES)', src: 'Feromonas.glb' },
    { id: 'fertomax', name: 'FERTOMAX (BOOSTER NPK)', src: 'FertoMax.glb' },
    { id: 'greemig', name: 'GREEMI-G (TRICHODERMA)', src: 'Greemi G.glb' }
];

let currentIndex = 0;
const mainViewer = document.getElementById('main-viewer');
const customLoader = document.getElementById('custom-loader');
const progressFill = document.getElementById('progress-fill');
const progressPct = document.getElementById('load-pct');

mainViewer.addEventListener('progress', (event) => {
    const progress = event.detail.totalProgress;
    let percent = Math.round(progress * 100);
    if (isNaN(percent) || percent < 0) percent = 0;
    if (percent > 100) percent = 100;
    progressFill.style.width = `${percent}%`;
    progressPct.innerText = `${percent}%`;
    if (progress === 1) {
        customLoader.style.opacity = '0';
        setTimeout(() => customLoader.style.display = 'none', 400);
    }
});

function loadProduct(index) {
    const data = productsData[index];
    document.getElementById('product-header').innerText = data.name;
    progressFill.style.transition = 'none';
    progressFill.style.width = '0%';
    progressPct.innerText = '0%';
    customLoader.style.display = 'flex';
    customLoader.style.opacity = '1';
    setTimeout(() => {
        progressFill.style.transition = 'width 0.2s linear';
        mainViewer.src = data.src;
    }, 50);
}

function changeProduct(direction) {
    currentIndex += direction;
    if (currentIndex < 0) currentIndex = productsData.length - 1;
    if (currentIndex >= productsData.length) currentIndex = 0;
    loadProduct(currentIndex);
}

function hideTutorial() {
    const tut = document.getElementById('tutorial');
    if (tut) {
        tut.style.opacity = '0';
        setTimeout(() => tut.style.display = 'none', 400);
        mainViewer.classList.remove('blurred');
    }
}

function activateCurrentAR() {
    if (mainViewer && mainViewer.canActivateAR) {
        mainViewer.activateAR();
    } else {
        alert("Perangkat Anda tidak mendukung AR.");
    }
}

window.addEventListener('keydown',(e)=>{
    if(e.key==='ArrowRight') changeProduct(1);
    if(e.key==='ArrowLeft') changeProduct(-1);
});

let touchStartX=0;
window.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
window.addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].screenX;
    if(Math.abs(diff) > 80) {
        if(diff > 0) changeProduct(1);
        else changeProduct(-1);
    }
});
</script>
</body>
</html>
