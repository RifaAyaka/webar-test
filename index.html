<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Montserrat',sans-serif;
    /* UBAH KE PUTIH POLOS */
    background: #ffffff; 
}

/* bg-overlay dihapus atau diset agar tidak menimpa warna putih */
.bg-overlay{ display: none; }

.floating-light{ display: none; }

.logo-top-right{
    position:fixed;
    top:18px;
    right:18px;
    z-index:9999;
    transition:.3s;
}

.logo-top-right:hover{ transform:scale(1.05); }
.logo-top-right img{
    height:60px;
    filter:drop-shadow(0 8px 20px rgba(0,0,0,.18));
}

#product-header{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:9999;
    background:linear-gradient(145deg,#2e7d32,#43a047);
    padding:14px 34px;
    border-radius:999px;
    border:2px solid #fbc02d;
    font-size:18px;
    font-weight:900;
    letter-spacing:.5px;
    color:white;
    box-shadow: 0 15px 35px rgba(46,125,50,.35), inset 0 1px 2px rgba(255,255,255,.2);
    backdrop-filter:blur(18px);
    white-space:nowrap;
}

.nav-zone{
    position:fixed;
    top:0;
    bottom:0;
    width:15%;
    z-index:999;
    cursor:pointer;
}
#left-zone{ left:0; }
#right-zone{ right:0; }

model-viewer{
    width:100%;
    height:100vh;
    --progress-bar-color:transparent;
    z-index: 10;
    position: relative;
    /* MENGATUR BACKGROUND MODEL VIEWER JADI PUTIH */
    background-color: #ffffff;
}

#custom-loader {
    position: fixed;
    inset: 0;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 50000;
    transition: opacity 0.4s ease;
}

.loading-text { font-size: 14px; font-weight: 900; color: #2e7d32; letter-spacing: 2px; margin-bottom: 15px; }
.progress-container { width: 70%; max-width: 350px; height: 10px; background: rgba(46, 125, 50, 0.15); border-radius: 20px; overflow: hidden; }
.progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #fbc02d, #2e7d32); border-radius: 20px; transition: width 0.2s linear; }

#window-overlay {
    position: fixed;
    inset: 0;
    z-index: 999999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(10px);
}

.window-box {
    position: relative;
    width: 100%;
    max-width: 650px;
    max-height: 80vh;
    overflow: hidden;
    border-radius: 24px;
    background: #ffffff;
    border: 1px solid #ddd;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.window-content { padding: 28px; overflow-y: auto; max-height: 80vh; }
.close-btn { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border: none; border-radius: 50%; background: #ef5350; color: white; cursor: pointer; }
.window-title { font-size: 16px; font-weight: 900; text-transform: uppercase; color: #2e7d32; border-bottom: 2px solid #fbc02d; padding-bottom: 12px; margin-bottom: 16px; }

.ar-btn {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    z-index: 99999;
    padding: 15px 55px;
    border: none;
    border-radius: 16px;
    background: #2e7d32;
    font-size: 13px;
    font-weight: 900;
    color: white;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}

@media(max-width:768px){
    #product-header { width: 82%; font-size: 13px; padding: 11px 14px; }
    .ar-btn { width: 80%; padding: 13px; bottom: 16px; }
}
</style>
</head>

<body>

<div id="product-header">KECAMBAH SAWIT PPKS</div>

<div id="left-zone" class="nav-zone" onclick="changeProduct(-1)"></div>
<div id="right-zone" class="nav-zone" onclick="changeProduct(1)"></div>

<div id="custom-loader">
    <div class="loading-text">MEMUAT 3D... <span id="load-pct">0%</span></div>
    <div class="progress-container">
        <div class="progress-fill" id="progress-fill"></div>
    </div>
</div>

<div id="window-overlay" onclick="closeWindow(event)">
    <div class="window-box" onclick="event.stopPropagation()">
        <button class="close-btn" onclick="closeWindow()">✕</button>
        <div class="window-content" id="window-body"></div>
    </div>
</div>

<button class="ar-btn" onclick="activateCurrentAR()">BUKA KATALOG AR</button>

<model-viewer id="main-viewer"
    src="kecambah_sawit.glb"
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate 
    rotation-per-second="8deg" 
    interaction-prompt="none" 
    field-of-view="28deg" 
    camera-orbit="0deg 75deg auto" 
    environment-image="neutral">
</model-viewer>

<script>
const productsData = [
    { id: 'kecambah', name: 'KECAMBAH SAWIT PPKS', src: 'kecambah_sawit.glb' },
    { id: 'bibit3', name: 'BIBIT SAWIT 3 BULAN (PN)', src: 'bibitsawit3bulan.glb' },
    { id: 'bibit8', name: 'BIBIT SAWIT 4-8 BULAN (MN)', src: 'bibitsawit4-8bulan.glb' },
    { id: 'bibit12', name: 'BIBIT SAWIT 9-12 BULAN', src: 'bibitsawit9-12bulan.glb' },
    { id: 'bioneensis', name: 'BIONEENSIS (PUPUK HAYATI)', src: 'bioneensis.glb' },
    { id: 'feromonas', name: 'FEROMONAS (TRAP ORYCTES)', src: 'Feromonas.glb' },
    { id: 'fertomax', name: 'FERTOMAX (BOOSTER NPK)', src: 'FertoMax.glb' },
    { id: 'greemig', name: 'GREEMI-G (TRICHODERMA)', src: 'Greemi G.glb' }
];

let currentIndex = 0;
const mainViewer = document.getElementById('main-viewer');
const customLoader = document.getElementById('custom-loader');
const progressFill = document.getElementById('progress-fill');
const progressPct = document.getElementById('load-pct');

mainViewer.addEventListener('progress', (event) => {
    const progress = event.detail.totalProgress;
    let percent = Math.round(progress * 100);
    progressFill.style.width = `${percent}%`;
    progressPct.innerText = `${percent}%`;
    if (progress === 1) {
        customLoader.style.opacity = '0';
        setTimeout(() => customLoader.style.display = 'none', 400);
    }
});

function loadProduct(index) {
    const data = productsData[index];
    document.getElementById('product-header').innerText = data.name;
    customLoader.style.display = 'flex';
    customLoader.style.opacity = '1';
    mainViewer.src = data.src;
}

function changeProduct(direction) {
    currentIndex += direction;
    if (currentIndex < 0) currentIndex = productsData.length - 1;
    if (currentIndex >= productsData.length) currentIndex = 0;
    loadProduct(currentIndex);
}

function activateCurrentAR() {
    if (mainViewer && mainViewer.canActivateAR) {
        mainViewer.activateAR();
    } else {
        alert("Perangkat Anda tidak mendukung AR.");
    }
}

function closeWindow(e) {
    if(!e || e.target.id === 'window-overlay' || e.target.closest('.close-btn')) {
        document.getElementById('window-overlay').style.display = 'none';
    }
}
</script>
</body>
</html>
